[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strix"
version = "0.1.0"
description = "CLI tool that scans repos and spins up environments using AI-generated configs."
authors = [{name = "Sanjay Rohith"}]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "fastapi",
    "uvicorn",
    "requests",
    "openai",
    "groq",
    "python-dotenv"
]

[project.urls]
Homepage = "https://github.com/sanjayrohith/StrixReady"
Repository = "https://github.com/sanjayrohith/StrixReady"

[project.scripts]
strix = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "backend*"]

[tool.setuptools.package-data]
backend = ["prompts/*.txt"]
